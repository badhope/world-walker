name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验展示站素材齐全
        run: |
          python - <<'PY'
          import os, sys
          need = [
              "docs/index.html",
              "docs/screenshots/stage-xuanshu.png",
              "docs/screenshots/stage-ink.png",
              "docs/screenshots/stage-neon.png",
              "docs/screenshots/stage-neutral.png",
              "docs/screenshots/walkthrough.mp4",
              "docs/BENCHMARK.md",
          ]
          missing = [p for p in need if not os.path.exists(p) or os.path.getsize(p) == 0]
          print("missing:", missing)
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检查 Pages 是否已启用（未启用时给出可执行提示，而不是静默失败）
        id: check
        run: |
          if [ -z "${{ vars.PAGES_ENABLED }}" ]; then
            echo "::notice::仓库尚未启用 GitHub Pages。启用步骤：Settings → Pages → Build and deployment → Source 选 GitHub Actions。启用后本工作流会自动部署。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - id: deployment
        if: steps.check.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
