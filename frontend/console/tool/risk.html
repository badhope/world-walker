<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk · RCA Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/console.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="console-layout">
    <aside class="console-sidebar" id="sidebar"></aside>
    <main class="console-main">
      <header class="console-page-header">
        <h1>Risk <span class="console-card--tool__zh">风险</span></h1>
        <p class="console-page-header__desc">
          VaR / CVaR 95% &amp; 99% 历史模拟 + GARCH(1,1) 条件波动率 + 滚动波动率。
          衡量最坏情况下(尾部)的损失。
        </p>
      </header>

      <div class="console-card">
        <form id="form" class="console-form">
          <div class="console-form__row">
            <div class="console-field">
              <label class="console-field__label">Scope · 范围</label>
              <select name="scope" class="console-select">
                <option value="city">city</option>
                <option value="province">province</option>
              </select>
            </div>
            <div class="console-field">
              <label class="console-field__label">Name</label>
              <input name="name" class="console-input" list="city-list" required>
              <datalist id="city-list"></datalist>
            </div>
            <div class="console-field">
              <label class="console-field__label">Indicator</label>
              <select name="indicator" class="console-select" id="indicator"></select>
            </div>
          </div>
          <button type="submit" class="console-button" id="run-btn">Run · 风险</button>
        </form>
      </div>

      <div id="result-error"></div>

      <div id="result-section" class="console-hidden">
        <div class="console-card">
          <h3 class="console-card__title">VaR / CVaR 95% &amp; 99%</h3>
          <div id="risk-chart" class="console-chart"></div>
        </div>

        <div class="console-card-grid" id="metrics-cards"></div>

        <div class="console-card">
          <h3 class="console-card__title">详细</h3>
          <table class="console-table" id="risk-table">
            <thead><tr><th>指标</th><th>百分比</th><th>金额</th><th>含义</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

        <div class="console-card">
          <h3 class="console-card__title">GARCH(1,1) 条件波动率</h3>
          <p class="console-text-muted" id="garch-text">—</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/form-helpers.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/chart.js"></script>
  <script>
  (async function () {
    await RCA.form.populateCityDatalist("city-list");
    await RCA.form.populateIndicatorSelect("indicator");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      RCA.form.clearError("result-error");
      const params = RCA.form.formToDict(e.target);
      const r = await RCA.api.runTool("get_risk", params);
      if (!r.ok) { RCA.form.showError("result-error", r.error); return; }
      const data = r.data.data;
      document.getElementById("result-section").classList.remove("console-hidden");

      RCA.chart.renderRiskChart("risk-chart", data);

      // 顶部 metrics 卡
      const vol = data.volatility || {};
      const garch = data.garch || {};
      const metrics = [
        { label: "年化波动率", value: vol.annualized_volatility != null ? (vol.annualized_volatility * 100).toFixed(2) + "%" : "—" },
        { label: "VaR 95% 损失", value: data.var_95?.var_pct != null ? (data.var_95.var_pct * 100).toFixed(2) + "%" : "—" },
        { label: "VaR 99% 损失", value: data.var_99?.var_pct != null ? (data.var_99.var_pct * 100).toFixed(2) + "%" : "—" },
        { label: "GARCH 条件波", value: garch.conditional_vol_pct != null ? garch.conditional_vol_pct.toFixed(2) + "%" : "—" },
      ];
      const container = document.getElementById("metrics-cards");
      container.innerHTML = "";
      metrics.forEach((mm) => {
        const div = document.createElement("div");
        div.className = "console-card console-metric";
        div.innerHTML = '<div class="console-metric__label">' + RCA.form.escapeHtml(mm.label) +
          '</div><div class="console-metric__value">' + RCA.form.escapeHtml(String(mm.value)) + "</div>";
        container.appendChild(div);
      });

      // 详细表
      const tbody = document.querySelector("#risk-table tbody");
      tbody.innerHTML = "";
      const rows = [
        ["VaR 95%", data.var_95?.var_pct, data.var_95?.var_amount, data.var_95?.interpretation],
        ["VaR 99%", data.var_99?.var_pct, data.var_99?.var_amount, data.var_99?.interpretation],
        ["CVaR 95%", data.var_95?.cvar_pct, data.var_95?.cvar_amount, "最坏 5% 平均损失"],
        ["CVaR 99%", data.var_99?.cvar_pct, data.var_99?.cvar_amount, "最坏 1% 平均损失"],
      ];
      rows.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + RCA.form.escapeHtml(row[0]) + "</td>" +
          "<td class='console-text-mono'>" + (row[1] != null ? (row[1] * 100).toFixed(2) + "%" : "—") + "</td>" +
          "<td class='console-text-mono'>" + (row[2] != null ? row[2].toFixed(2) : "—") + "</td>" +
          "<td class='console-text-small'>" + RCA.form.escapeHtml(row[3] || "—") + "</td>";
        tbody.appendChild(tr);
      });

      // GARCH 解释
      const garchText = garch.method
        ? garch.method + (garch.forecast_vol_pct != null ? " · 预测波 " + garch.forecast_vol_pct.toFixed(2) + "%" : "")
        : "—";
      document.getElementById("garch-text").textContent = garchText;
    };
  })();
  </script>
</body>
</html>
