data: {}
industry:
  data_requirements:
  - land_price
  - labor_cost
  - energy_cost
  - market_size
  - talent_pool
  - infrastructure
  - tax_incentive
  - subsidy
  - approval_efficiency
  description: 适用于各类企业的通用分析模板
  dimensions:
  - description: 评估运营成本
    display_name: 成本维度
    higher_is_better:
      energy_cost: false
      labor_cost: false
      land_price: false
    metric_weights:
      energy_cost: 0.2
      labor_cost: 0.45
      land_price: 0.35
    metrics:
    - land_price
    - labor_cost
    - energy_cost
    name: cost
    weight: 0.4
  - description: 评估商业环境
    display_name: 环境维度
    higher_is_better:
      infrastructure: true
      market_size: true
      talent_pool: true
    metric_weights:
      infrastructure: 0.25
      market_size: 0.4
      talent_pool: 0.35
    metrics:
    - market_size
    - talent_pool
    - infrastructure
    name: environment
    weight: 0.35
  - description: 评估政策支持
    display_name: 政策维度
    higher_is_better:
      approval_efficiency: false
      subsidy: true
      tax_incentive: true
    metric_weights:
      approval_efficiency: 0.25
      subsidy: 0.35
      tax_incentive: 0.4
    metrics:
    - tax_incentive
    - subsidy
    - approval_efficiency
    name: policy
    weight: 0.25
  industry_id: default
  industry_name: 通用行业
  industry_type: services
  metrics:
    approval_efficiency:
      benchmark_method: percentile
      data_source: 政务服务中心
      description: 平均审批时间
      display_name: 审批效率
      name: approval_efficiency
      unit: 天
    energy_cost:
      benchmark_method: percentile
      data_source: 公开数据
      description: 工业电价
      display_name: 能源成本
      name: energy_cost
      unit: 元/千瓦时
    infrastructure:
      benchmark_method: percentile
      data_source: 行业报告
      description: 基础设施评分
      display_name: 基础设施
      name: infrastructure
      unit: 分
    labor_cost:
      benchmark_method: percentile
      data_source: 统计年鉴
      description: 平均工资水平
      display_name: 劳动力成本
      name: labor_cost
      unit: 元/月
    land_price:
      benchmark_method: percentile
      data_source: 统计年鉴
      description: 工业用地价格
      display_name: 土地价格
      name: land_price
      unit: 元/㎡
    market_size:
      benchmark_method: percentile
      data_source: 统计局
      description: GDP规模
      display_name: 市场规模
      name: market_size
      unit: 亿元
    subsidy:
      benchmark_method: percentile
      data_source: 财政局
      description: 政府补贴金额
      display_name: 补贴金额
      name: subsidy
      unit: 亿元
    talent_pool:
      benchmark_method: percentile
      data_source: 教育局
      description: 高等院校在校生
      display_name: 人才储备
      name: talent_pool
      unit: 万人
    tax_incentive:
      benchmark_method: percentile
      data_source: 税务局
      description: 税收减免金额
      display_name: 税收优惠
      name: tax_incentive
      unit: 亿元
  success_metrics:
  - market_size
  - talent_pool
  - tax_incentive
ml:
  cross_validation_folds: 5
  feature_columns:
  - land_price
  - labor_cost
  - energy_cost
  - talent_pool
  - infrastructure
  - tax_incentive
  - subsidy
  hyperparameter_tuning: true
  id_column: region
  models:
  - xgboost
  - random_forest
  - prophet
  - linear_regression
  - gbdt
  target_metric: market_size
  time_column: year
  train_size: 0.8
  validation_size: 0.2
project_name: default_project
regions:
- 北京
- 上海
- 广州
- 深圳
