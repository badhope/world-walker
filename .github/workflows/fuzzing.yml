name: Fuzzing

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 2 * * *"
  push:
    branches: [main, develop]
    paths:
      - "backend/api/**"
      - "backend/analysis/**"
      - "tests/fuzz/**"
  workflow_dispatch:

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: false

# Minimal token permissions (OpenSSF Scorecard: Token-Permissions)
permissions:
  contents: read

jobs:
  fuzz:
    name: Property-based fuzzing (Hypothesis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Hypothesis fuzzing
        run: |
          pytest tests/fuzz/ \
            --hypothesis-seed=$(date +%s) \
            -v --tb=long \
            --log-cli-level=INFO \
            2>&1 | tee fuzz-output.log

      - name: Upload fuzz results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-output
          path: fuzz-output.log
          retention-days: 30

      - name: OSS-Fuzz corpus upload
        if: failure()
        run: |
          echo "Found potential fuzzing failures. Report to OSS-Fuzz if applicable."
          # Future: integrate with Google OSS-Fuzz clusterfuzzlite
          # See: https://google.github.io/oss-fuzz/getting-started/new_project-guide/
