name: CI
displayName: World Walker CI

# Gitee Go uses its own stage/step schema, not GitHub Actions syntax.
# The project needs Python 3.10+, while the Gitee image ships 3.9; the first
# block installs a managed 3.12 interpreter and exposes it as `python`.
triggers:
  push:
    - matchType: PRECISE
      branch: main
  pull_request:
    - matchType: PRECISE
      branch: main

stages:
  - stage:
      name: core
      displayName: 核心与文档
      failFast: true
      steps:
        - step: build@python
          name: core_checks
          displayName: 零依赖核心、玩法、文档
          pythonVersion: "3.9"
          commands:
            - |
              set -euo pipefail
              python -m pip install --quiet uv
              python -m uv python install 3.12
              PYBIN=$(python -m uv python find 3.12)
              mkdir -p "$HOME/.local/bin"
              ln -sf "$PYBIN" "$HOME/.local/bin/python"
              export PATH="$HOME/.local/bin:$PATH"
              python --version
              python scripts/compile_all.py
              python scripts/verify_tests.py
              python scripts/run_behavior_regressions.py
              python scripts/verify_cli.py
              python scripts/verify_panel.py
              python scripts/verify_player_shell.py
              python scripts/verify_near_death.py
              python scripts/verify_formulas.py
              python scripts/verify_branches.py
              python scripts/verify_settings.py
              python scripts/verify_domain_model.py
              python scripts/metrics.py --check
              python scripts/verify_surface.py
              python scripts/verify_mechanics.py
              python scripts/verify_replay.py
              python scripts/verify_docs.py
              python scripts/verify_gameplay.py
              python scripts/verify_generic.py
              python scripts/verify_systems.py
              python scripts/verify_mcp_mode.py

  - stage:
      name: mcp
      displayName: MCP 端到端
      failFast: true
      steps:
        - step: build@python
          name: mcp_checks
          displayName: MCP、回归与长局
          pythonVersion: "3.9"
          commands:
            - |
              set -euo pipefail
              python -m pip install --quiet uv
              python -m uv python install 3.12
              PYBIN=$(python -m uv python find 3.12)
              mkdir -p "$HOME/.local/bin"
              ln -sf "$PYBIN" "$HOME/.local/bin/python"
              export PATH="$HOME/.local/bin:$PATH"
              python -m uv pip install --python "$PYBIN" -r requirements-mcp.lock.txt
              python -m uv pip install --python "$PYBIN" --no-deps -e ".[mcp]"
              python -m pip check
              WORLD_GAMES_STRICT=1 python scripts/verify_world.py
              WORLD_GAMES_STRICT=1 python scripts/verify_generic.py
              WORLD_GAMES_STRICT=1 python scripts/verify_systems.py
              python scripts/verify_audit_fix.py
              python scripts/verify_mcp_stdio.py
              python scripts/verify_injection.py
              python scripts/verify_mutation.py
              python scripts/user_playtest.py
              python scripts/stress_freeplay.py 500

  - stage:
      name: package
      displayName: 打包完整性
      failFast: true
      steps:
        - step: build@python
          name: package_checks
          displayName: wheel 构建与安装验证
          pythonVersion: "3.9"
          commands:
            - |
              set -euo pipefail
              python -m pip install --quiet uv
              python -m uv python install 3.12
              PYBIN=$(python -m uv python find 3.12)
              mkdir -p "$HOME/.local/bin"
              ln -sf "$PYBIN" "$HOME/.local/bin/python"
              export PATH="$HOME/.local/bin:$PATH"
              python -m uv pip install --python "$PYBIN" build
              python -m build
              python scripts/check_wheel.py dist
              python -c "import zipfile, glob; w=sorted(glob.glob('dist/*.whl'))[0]; z=zipfile.ZipFile(w); assert any(n.endswith('panel.html') for n in z.namelist())"
