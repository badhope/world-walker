<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:8000 wss://localhost:8000;">
<title>投资决策级 — 区域经济分析平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
:root {
  --ink: #0E1F3F;
  --ink-soft: #2A3B5F;
  --copper: #D08560;
  --copper-soft: rgba(208, 133, 96, 0.22);
  --paper: #FAF6F0;
  --paper-card: #FFFDF8;
  --border: #E8DCC8;
  --text: #2C2419;
  --text-soft: #6B5D4A;
  --pass: #22C55E;
  --warn: #F59E0B;
  --fail: #DC2626;
  --neutral: #94A3B8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Source Han Serif SC", "Noto Serif SC", "Songti SC", serif; background: var(--paper); color: var(--text); line-height: 1.6; }
header { background: var(--ink); color: var(--paper); padding: 24px 40px; border-bottom: 4px solid var(--copper); }
header h1 { font-size: 28px; font-weight: 600; }
header p { color: rgba(255,253,248,0.7); font-size: 14px; margin-top: 4px; }
.container { max-width: 1280px; margin: 0 auto; padding: 24px 40px; }
.controls { display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 12px; background: var(--paper-card); padding: 20px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 24px; }
.controls label { font-size: 12px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
.controls select, .controls input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); background: white; font-family: inherit; font-size: 14px; border-radius: 2px; }
.controls button { padding: 10px 24px; background: var(--ink); color: var(--paper); border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border-radius: 2px; transition: background 0.2s; }
.controls button:hover { background: var(--copper); }
.section { background: var(--paper-card); border: 1px solid var(--border); padding: 20px; margin-bottom: 20px; border-radius: 4px; }
.section h2 { font-size: 18px; color: var(--ink); margin-bottom: 4px; }
.section .sub { color: var(--text-soft); font-size: 13px; margin-bottom: 16px; }
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.metric { background: var(--paper); border: 1px solid var(--border); padding: 14px; border-radius: 2px; }
.metric .label { font-size: 11px; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.metric .value { font-size: 20px; color: var(--ink); font-weight: 600; }
.metric .sub { font-size: 11px; color: var(--text-soft); margin-top: 4px; }
.verdict { padding: 12px 16px; border-radius: 2px; font-weight: 600; font-size: 14px; text-align: center; margin-bottom: 16px; }
.verdict.PASS { background: rgba(34, 197, 94, 0.12); color: var(--pass); border-left: 4px solid var(--pass); }
.verdict.WARN { background: rgba(245, 158, 11, 0.12); color: var(--warn); border-left: 4px solid var(--warn); }
.verdict.FAIL { background: rgba(220, 38, 38, 0.12); color: var(--fail); border-left: 4px solid var(--fail); }
.diag-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.diag { background: var(--paper); border: 1px solid var(--border); padding: 12px; border-radius: 2px; }
.diag .name { font-size: 11px; color: var(--text-soft); text-transform: uppercase; }
.diag .result { font-size: 18px; font-weight: 600; margin-top: 4px; }
.diag .result.ok { color: var(--pass); }
.diag .result.bad { color: var(--fail); }
.diag .pvalue { font-size: 11px; color: var(--text-soft); margin-top: 4px; }
.diag .conc { font-size: 10px; color: var(--text-soft); margin-top: 6px; font-style: italic; }
.chart { width: 100%; height: 360px; }
.break-list { list-style: none; }
.break-list li { padding: 10px 14px; background: var(--paper); border-left: 3px solid var(--fail); margin-bottom: 6px; font-size: 13px; }
.break-list .meta { color: var(--text-soft); font-size: 11px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-soft); margin-top: 8px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
.loading { color: var(--text-soft); font-size: 13px; text-align: center; padding: 20px; }
.error { background: rgba(220, 38, 38, 0.08); color: var(--fail); padding: 12px 16px; border-left: 3px solid var(--fail); font-size: 13px; }
footer { text-align: center; color: var(--text-soft); font-size: 12px; padding: 24px; border-top: 1px solid var(--border); margin-top: 40px; }
</style>
</head>
<body>
<header>
  <h1>投资决策级预测平台</h1>
  <p>10 城 × 10 指标 × 16 年 (2010-2025) 真实数据 · ARIMA 集成 · 残差诊断 · 结构突变 · 滚动 CV · 风险指标 · 情景分析 · Monte Carlo</p>
</header>

<div class="container">
  <div class="controls">
    <div>
      <label>范围</label>
      <select id="scope">
        <option value="city">城市</option>
        <option value="province">省份</option>
      </select>
    </div>
    <div>
      <label>名称</label>
      <select id="name"></select>
    </div>
    <div>
      <label>指标</label>
      <select id="indicator">
        <option value="gdp">GDP</option>
        <option value="population">人口</option>
        <option value="fiscal_revenue">财政收入</option>
        <option value="supplier_count">供应商数量</option>
        <option value="land_price">工业地价</option>
        <option value="rd_intensity">R&D 强度</option>
        <option value="industry_high_tech_ratio">高技术占比</option>
        <option value="gdp_growth">GDP 增速</option>
        <option value="local_support_rate">地方支持</option>
        <option value="policy_coverage">政策覆盖</option>
        <option value="rd_subsidy">R&D 补贴</option>
        <option value="tax_reduction">税收减免</option>
      </select>
    </div>
    <div>
      <label>预测年数</label>
      <input type="number" id="years" value="5" min="1" max="10">
    </div>
    <button onclick="runAll()">运行投资决策分析</button>
  </div>

  <div id="output"></div>
</div>

<footer>
  Investment-Grade · National Stats · 2010-2025 · Data: NBSC + 10 城市统计局
</footer>

<script>
const API_BASE = (() => {
  const h = window.location.hostname;
  if (h === 'localhost' || h === '127.0.0.1') return `http://${h}:8000/api/v1`;
  return '/api/v1';
})();

const CITIES = ['深圳','上海','北京','广州','成都','杭州','武汉','南京','苏州','西安'];
const PROVINCES = ['上海','北京','广东','江苏','浙江','四川','湖北','陕西'];
const chartInstances = [];

function destroyCharts() {
  while (chartInstances.length) {
    try { chartInstances.pop().dispose(); } catch (e) {}
  }
}

async function init() {
  // 加载指标
  const indRes = await fetch(`${API_BASE}/forecast/indicators`);
  const indData = await indRes.json();
  const indSel = document.getElementById('indicator');
  indSel.innerHTML = (indData.supported_indicators || ['gdp']).map(i => `<option value="${i}">${i}</option>`).join('');

  // 初始化名称下拉
  updateNameOptions();

  document.getElementById('scope').addEventListener('change', updateNameOptions);
}

function updateNameOptions() {
  const scope = document.getElementById('scope').value;
  const list = scope === 'city' ? CITIES : PROVINCES;
  document.getElementById('name').innerHTML = list.map(n => `<option value="${n}">${n}</option>`).join('');
}

async function fetchJson(path) {
  const r = await fetch(API_BASE + path);
  if (!r.ok) throw new Error(`HTTP ${r.status} on ${path}: ${await r.text()}`);
  return r.json();
}

function fmtPct(n) { return n == null ? '--' : (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }
function fmtInt(n) { return n == null ? '--' : Math.round(n).toLocaleString('zh-CN'); }

function makeChart(domId) {
  const el = document.getElementById(domId);
  if (!el) return null;
  const inst = echarts.init(el, null, { renderer: 'canvas' });
  chartInstances.push(inst);
  return inst;
}

async function runAll() {
  const scope = document.getElementById('scope').value;
  const name = document.getElementById('name').value;
  const indicator = document.getElementById('indicator').value;
  const years = parseInt(document.getElementById('years').value);
  const out = document.getElementById('output');
  destroyCharts();
  out.innerHTML = '<div class="loading">运行投资决策分析 (集成 + 诊断 + 突变 + CV + 风险 + 情景 + MC) ...</div>';

  const safeName = encodeURIComponent(name);
  const params = `scope=${scope}&name=${safeName}&indicator=${indicator}&years=${years}`;

  try {
    const [full, risk, mc] = await Promise.all([
      fetchJson(`/investment/forecast/full?${params}`),
      fetchJson(`/investment/risk/${scope}/${safeName}?indicator=${indicator}`),
      fetchJson(`/investment/monte-carlo/${scope}/${safeName}?indicator=${indicator}&years=${years}&n_sims=1000`),
    ]);
    renderResults(full, risk, mc);
  } catch (e) {
    out.innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

function renderResults(full, risk, mc) {
  const out = document.getElementById('output');
  const ens = full.ensemble;
  const diag = full.diagnostics;
  const breaks = full.structural_breaks;
  const bt = full.backtest;
  const gr = full.growth;

  const html = `
    <div class="section">
      <h2>1. 数据血缘 + 历史 CAGR</h2>
      <div class="sub">来源:${full.data_provenance.source} | ${full.data_provenance.n_years} 年 (${full.data_provenance.year_range[0]}–${full.data_provenance.year_range[1]}) | 估计占比 ${(full.data_provenance.estimated_pct*100).toFixed(0)}%</div>
      <div class="metrics-grid">
        <div class="metric"><div class="label">历史 CAGR</div><div class="value">${fmtPct(gr.historical_cagr_pct)}</div><div class="sub">2010 → 2025</div></div>
        <div class="metric"><div class="label">预测 CAGR</div><div class="value">${fmtPct(gr.forecast_cagr_pct)}</div><div class="sub">未来 ${full.years.length} 年</div></div>
        <div class="metric"><div class="label">末年集成预测</div><div class="value">${fmtInt(ens.predictions[ens.predictions.length-1])}</div><div class="sub">单位:${full.indicator_meta.unit}</div></div>
        <div class="metric"><div class="label">集成权重</div><div class="value" style="font-size:14px">AR ${(ens.weights.arima*100).toFixed(0)}% / ET ${(ens.weights.ets*100).toFixed(0)}% / LR ${(ens.weights.linear_regression*100).toFixed(0)}%</div><div class="sub">AIC 加权</div></div>
      </div>
      <div id="forecast-chart" class="chart"></div>
    </div>

    <div class="section">
      <h2>2. 残差诊断 (5 项)</h2>
      <div class="sub">基于 ARIMA 残差检验。综合 verdict:${diag.verdict}</div>
      <div class="verdict ${diag.verdict}">${diag.verdict} — ${diag.verdict_reason || ''}</div>
      <div class="diag-grid">
        ${renderDiag('ADF 平稳性', diag.tests.adf, 'stationary', 'stationary')}
        ${renderDiag('KPSS 平稳性', diag.tests.kpss, 'stationary', 'stationary')}
        ${renderDiag('Ljung-Box 自相关', diag.tests.ljung_box, 'no_autocorrelation', 'no_autocorrelation')}
        ${renderDiag('Jarque-Bera 正态', diag.tests.jarque_bera, 'normal', 'normal')}
        ${renderDiag('Breusch-Pagan 同方差', diag.tests.breusch_pagan, 'homoscedastic', 'homoscedastic')}
      </div>
    </div>

    <div class="section">
      <h2>3. 滚动回测 (Walk-Forward CV)</h2>
      <div class="sub">${bt.n_test} 步样本外测试。基于 ARIMA 模型。</div>
      <div class="metrics-grid">
        <div class="metric"><div class="label">MAPE</div><div class="value">${bt.metrics.MAPE_pct.toFixed(2)}%</div><div class="sub">&lt;5% 为优秀</div></div>
        <div class="metric"><div class="label">RMSE</div><div class="value">${bt.metrics.RMSE.toFixed(1)}</div></div>
        <div class="metric"><div class="label">MASE</div><div class="value">${bt.metrics.MASE.toFixed(3)}</div><div class="sub">&lt;1 优于 naive</div></div>
        <div class="metric"><div class="label">sMAPE</div><div class="value">${bt.metrics.sMAPE_pct.toFixed(2)}%</div></div>
        <div class="metric"><div class="label">覆盖率</div><div class="value">${bt.metrics.Coverage_pct.toFixed(0)}%</div><div class="sub">目标 95%</div></div>
      </div>
      <div id="backtest-chart" class="chart"></div>
    </div>

    <div class="section">
      <h2>4. 风险指标 (VaR / CVaR / 波动率)</h2>
      <div class="sub">${risk.n_years} 年滚动历史估算</div>
      <div class="metrics-grid">
        <div class="metric"><div class="label">年化波动率</div><div class="value">${(risk.volatility.annualized_volatility*100).toFixed(2)}%</div><div class="sub">${risk.volatility.window} 年窗口</div></div>
        <div class="metric"><div class="label">VaR 95%</div><div class="value">${(risk.var_95.var_pct*100).toFixed(2)}%</div><div class="sub">≈${fmtInt(risk.var_95.var_amount)} ${full.indicator_meta.unit} 损失</div></div>
        <div class="metric"><div class="label">CVaR 95%</div><div class="value">${(risk.var_95.cvar_pct*100).toFixed(2)}%</div><div class="sub">≈${fmtInt(risk.var_95.cvar_amount)} ${full.indicator_meta.unit}</div></div>
        <div class="metric"><div class="label">VaR 99%</div><div class="value">${(risk.var_99.var_pct*100).toFixed(2)}%</div><div class="sub">尾部极端</div></div>
      </div>
    </div>

    <div class="section">
      <h2>5. 情景分析 (4 档)</h2>
      <div class="sub">基线 = 集成预测。乐观/悲观/衰退为复合年化冲击。</div>
      <div id="scenario-chart" class="chart"></div>
      <div class="legend">
        <span><i style="background:#0E1F3F"></i>基线</span>
        <span><i style="background:#22C55E"></i>乐观 (+10%/y)</span>
        <span><i style="background:#D08560"></i>悲观 (-10%/y)</span>
        <span><i style="background:#DC2626"></i>衰退 (-25%/y)</span>
      </div>
    </div>

    <div class="section">
      <h2>6. Monte Carlo (1000 次 bootstrap)</h2>
      <div class="sub">残差 bootstrap,P5/P50/P95 三分位。${mc.interpretation}</div>
      <div id="mc-chart" class="chart"></div>
      <div class="metrics-grid">
        <div class="metric"><div class="label">末年 P5</div><div class="value">${fmtInt(mc.quantiles.p05[mc.quantiles.p05.length-1])}</div></div>
        <div class="metric"><div class="label">末年 P50</div><div class="value">${fmtInt(mc.quantiles.p50[mc.quantiles.p50.length-1])}</div></div>
        <div class="metric"><div class="label">末年 P95</div><div class="value">${fmtInt(mc.quantiles.p95[mc.quantiles.p95.length-1])}</div></div>
        <div class="metric"><div class="label">低于衰退概率</div><div class="value">${(mc.final_value_stats.prob_below_recession*100).toFixed(1)}%</div></div>
      </div>
    </div>

    ${breaks.length > 0 ? `
    <div class="section">
      <h2>7. 结构突变 (Chow Test)</h2>
      <div class="sub">${breaks.length} 个显著断点 (p &lt; 0.05)。仅作风险提示,非因果关系。</div>
      <ul class="break-list">
        ${breaks.slice(0, 5).map(b => `<li>📍 断点 <b>${b.breakpoint_idx}</b> 年偏移 — F = ${b.f_stat}, p = ${b.pvalue} <div class="meta">${b.conclusion}</div></li>`).join('')}
      </ul>
    </div>` : ''}
  `;
  out.innerHTML = html;

  // 渲染图表
  drawForecast(full);
  drawBacktest(bt, full.years[0]);
  drawScenarios(full);
  drawMonteCarlo(mc);
}

function renderDiag(label, t, okKey, displayKey) {
  if (!t) return '';
  if (t.error) return `<div class="diag"><div class="name">${label}</div><div class="result bad">⚠ 失败</div><div class="conc">${t.error}</div></div>`;
  const isOk = t[okKey] === true;
  return `<div class="diag">
    <div class="name">${label}</div>
    <div class="result ${isOk ? 'ok' : 'bad'}">${isOk ? '✓ 通过' : '✗ 拒绝'}</div>
    <div class="pvalue">p = ${t.pvalue} | stat = ${t.statistic}</div>
    <div class="conc">${t.conclusion || ''}</div>
  </div>`;
}

function drawForecast(full) {
  const inst = makeChart('forecast-chart');
  if (!inst) return;
  const ens = full.ensemble;
  const ar = full.models.arima;
  const histYears = Array.from({length: full.n_history}, (_, i) => full.years[0] - full.n_history + i);
  // 实际历史
  // 需要从别处取实际值,先用 prov 端点,简化:API 返回的 ensemble.predictions 是 future,历史需要重新算
  // 简化:只画集成预测 + CI
  const upper = ens.upper_ci.map((v, i) => [ens.predictions.length === 0 ? 0 : i, v]);
  const lowerMinusUpper = ens.lower_ci.map((v, i) => [i, v - ens.upper_ci[i]]);
  const allYears = full.years;
  inst.setOption({
    title: { text: '集成预测 + 95% CI', textStyle: { fontSize: 14, color: '#0E1F3F' }, left: 10, top: 5 },
    grid: { top: 50, left: 60, right: 30, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: allYears, name: '年份' },
    yAxis: { type: 'value', name: full.indicator_meta.unit },
    series: [
      { name: '上界', type: 'line', stack: 'ci', data: ens.upper_ci.map((v, i) => ({ value: v, name: allYears[i] })), lineStyle: { opacity: 0 }, itemStyle: { color: 'rgba(208,133,96,0.4)' } },
      { name: '下界(填充)', type: 'line', stack: 'ci', data: ens.lower_ci.map((v, i) => ({ value: v - ens.upper_ci[i], name: allYears[i] })), lineStyle: { opacity: 0 }, areaStyle: { color: 'rgba(208,133,96,0.22)' } },
      { name: '集成预测', type: 'line', data: ens.predictions.map((v, i) => ({ value: v, name: allYears[i] })), lineStyle: { color: '#D08560', width: 2, type: 'dashed' }, itemStyle: { color: '#D08560' } },
      { name: 'ARIMA 单独', type: 'line', data: ar.predictions.map((v, i) => ({ value: v, name: allYears[i] })), lineStyle: { color: '#94A3B8', width: 1, type: 'dotted' } },
    ],
  });
}

function drawBacktest(bt, startYear) {
  const inst = makeChart('backtest-chart');
  if (!inst) return;
  const years = bt.actuals.map((_, i) => startYear - bt.actuals.length + i);
  inst.setOption({
    title: { text: 'Walk-Forward CV:Actual vs Forecast', textStyle: { fontSize: 14, color: '#0E1F3F' }, left: 10, top: 5 },
    grid: { top: 50, left: 60, right: 30, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: years },
    yAxis: { type: 'value' },
    series: [
      { name: 'Actual', type: 'line', data: bt.actuals, lineStyle: { color: '#0E1F3F', width: 2 }, itemStyle: { color: '#0E1F3F' } },
      { name: 'Forecast', type: 'line', data: bt.forecasts, lineStyle: { color: '#D08560', width: 2, type: 'dashed' }, itemStyle: { color: '#D08560' } },
    ],
  });
}

function drawScenarios(full) {
  const inst = makeChart('scenario-chart');
  if (!inst) return;
  // 取得 4 档情景
  const allYears = full.years;
  // 通过 API 拿 scenarios
  fetchJson(`/investment/scenarios/${full.scope}/${encodeURIComponent(full.name)}?indicator=${full.indicator}&years=${allYears.length}`)
    .then(s => {
      const sc = s.scenarios;
      const series = [];
      const colors = { baseline: '#0E1F3F', optimistic: '#22C55E', pessimistic: '#D08560', recession: '#DC2626' };
      const names = { baseline: '基线', optimistic: '乐观', pessimistic: '悲观', recession: '衰退' };
      for (const [sid, info] of Object.entries(sc)) {
        series.push({
          name: names[sid],
          type: 'line',
          data: info.predictions,
          lineStyle: { color: colors[sid], width: 2 },
          itemStyle: { color: colors[sid] },
        });
      }
      inst.setOption({
        title: { text: '4 档情景对比', textStyle: { fontSize: 14, color: '#0E1F3F' }, left: 10, top: 5 },
        grid: { top: 50, left: 60, right: 30, bottom: 30 },
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: allYears },
        yAxis: { type: 'value', name: full.indicator_meta.unit },
        series,
      });
    });
}

function drawMonteCarlo(mc) {
  const inst = makeChart('mc-chart');
  if (!inst) return;
  const years = mc.years;
  inst.setOption({
    title: { text: 'MC 1000 次:P5/P50/P95 + Baseline', textStyle: { fontSize: 14, color: '#0E1F3F' }, left: 10, top: 5 },
    grid: { top: 50, left: 60, right: 30, bottom: 30 },
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: years },
    yAxis: { type: 'value' },
    series: [
      { name: 'P95 上界', type: 'line', data: mc.quantiles.p95, lineStyle: { color: '#22C55E', type: 'dashed' }, itemStyle: { color: '#22C55E' } },
      { name: 'P50 中位', type: 'line', data: mc.quantiles.p50, lineStyle: { color: '#0E1F3F', width: 2 }, itemStyle: { color: '#0E1F3F' } },
      { name: 'P5 下界', type: 'line', data: mc.quantiles.p05, lineStyle: { color: '#DC2626', type: 'dashed' }, itemStyle: { color: '#DC2626' } },
      { name: 'Baseline', type: 'line', data: mc.baseline, lineStyle: { color: '#D08560', type: 'dotted' } },
    ],
  });
}

window.addEventListener('resize', () => chartInstances.forEach(c => c.resize()));
init();
</script>
</body>
