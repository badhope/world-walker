plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.worldwalker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.worldwalker.app'
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName '1.20.1'
        resourceConfigurations += ['zh', 'en']

        ndk {
            // arm64 covers current phones; x86_64 keeps emulator and x86 tablets testable.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython 'python3'
        pip {
            // Android's OpenSSL doesn't inherit the system CA store reliably; pin a bundle.
            install 'certifi==2026.11.20'
        }
    }
}
