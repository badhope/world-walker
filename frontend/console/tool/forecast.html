<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forecast · RCA Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/console.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="console-layout">
    <aside class="console-sidebar" id="sidebar"></aside>
    <main class="console-main">
      <header class="console-page-header">
        <h1>Forecast <span class="console-card--tool__zh">预测</span></h1>
        <p class="console-page-header__desc">
          多年 ensemble 预测 + 95% CI 区间 + diagnostics 摘要。
          默认后端跑 full pipeline:forecast + diagnostics + backtest。
        </p>
      </header>

      <div class="console-card">
        <form id="form" class="console-form">
          <div class="console-form__row">
            <div class="console-field">
              <label class="console-field__label">Scope · 范围</label>
              <select name="scope" class="console-select" id="scope">
                <option value="city">city · 城市</option>
                <option value="province">province · 省份</option>
              </select>
            </div>
            <div class="console-field">
              <label class="console-field__label">Name · 名称</label>
              <input name="name" class="console-input" list="city-list" placeholder="shenzhen / beijing / guangdong" required>
              <datalist id="city-list"></datalist>
            </div>
          </div>
          <div class="console-form__row">
            <div class="console-field">
              <label class="console-field__label">Indicator · 指标</label>
              <select name="indicator" class="console-select" id="indicator"></select>
            </div>
            <div class="console-field">
              <label class="console-field__label">Years · 预测年数</label>
              <input name="years" type="number" class="console-input" min="1" max="20" value="5">
            </div>
          </div>
          <div class="console-flex">
            <button type="submit" class="console-button" id="run-btn">Run · 预测</button>
            <span id="duration" class="console-text-muted console-text-small"></span>
          </div>
        </form>
      </div>

      <div id="result-error"></div>

      <div id="result-section" class="console-hidden">
        <div class="console-card">
          <div class="console-card__header">
            <h3 class="console-card__title">Ensemble Forecast</h3>
            <span id="verdict-badge"></span>
          </div>
          <div id="forecast-chart" class="console-chart console-chart--tall"></div>
        </div>

        <div class="console-card-grid" id="metrics-cards"></div>

        <div class="console-card">
          <h3 class="console-card__title">Raw JSON · 原始数据</h3>
          <details><summary>点击展开</summary><pre id="raw-json"></pre></details>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/form-helpers.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/chart.js"></script>
  <script>
  (async function () {
    await RCA.form.populateCityDatalist("city-list");
    await RCA.form.populateIndicatorSelect("indicator");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      RCA.form.clearError("result-error");
      document.getElementById("result-section").classList.add("console-hidden");
      const params = RCA.form.formToDict(e.target);
      const btn = document.getElementById("run-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="console-spinner"></span> 运行中...';
      const t0 = performance.now();
      const r = await RCA.api.runTool("get_forecast", params);
      const dt = Math.round(performance.now() - t0);
      btn.disabled = false;
      btn.textContent = "Run · 预测";
      if (!r.ok) {
        RCA.form.showError("result-error", r.error);
        return;
      }
      renderResult(r.data, dt);
    };

    function renderResult(resp, dt) {
      const data = resp.data;
      document.getElementById("result-section").classList.remove("console-hidden");
      document.getElementById("duration").textContent = "用时 " + resp.duration_ms + " ms · 前端 " + dt + " ms";

      const verdict = data.diagnostics_verdict || "—";
      const badgeClass = RCA.form.verdictClass(verdict);
      document.getElementById("verdict-badge").className = "console-badge console-badge--" + badgeClass;
      document.getElementById("verdict-badge").textContent = verdict;

      RCA.chart.renderForecastChart("forecast-chart", data.ensemble);

      const metrics = [
        { label: "Data Points", value: data.data_points ?? "—" },
        { label: "Backtest MAPE", value: data.backtest_mape != null ? data.backtest_mape.toFixed(2) + "%" : "—" },
        { label: "Years", value: (data.ensemble.predictions || []).length },
        { label: "Pred Y1", value: data.ensemble.predictions?.[0]?.toLocaleString() ?? "—" },
        { label: "Pred Y" + (data.ensemble.predictions || []).length, value: data.ensemble.predictions?.slice(-1)[0]?.toLocaleString() ?? "—" },
      ];
      const container = document.getElementById("metrics-cards");
      container.innerHTML = "";
      metrics.forEach((m) => {
        const div = document.createElement("div");
        div.className = "console-card";
        div.innerHTML = '<div class="console-metric__label">' + RCA.form.escapeHtml(m.label) + '</div><div class="console-metric__value">' + RCA.form.escapeHtml(String(m.value)) + "</div>";
        container.appendChild(div);
      });

      document.getElementById("raw-json").textContent = JSON.stringify(data, null, 2);
    }
  })();
  </script>
</body>
</html>
