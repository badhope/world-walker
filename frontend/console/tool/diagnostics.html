<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagnostics · RCA Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/console.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="console-layout">
    <aside class="console-sidebar" id="sidebar"></aside>
    <main class="console-main">
      <header class="console-page-header">
        <h1>Diagnostics <span class="console-card--tool__zh">残差诊断</span></h1>
        <p class="console-page-header__desc">
          5 项残差诊断(ADF / KPSS / Ljung-Box / Jarque-Bera / Breusch-Pagan)
          + 总体 verdict(OK / WARN / FAIL)。
        </p>
      </header>

      <div class="console-card">
        <form id="form" class="console-form">
          <div class="console-form__row">
            <div class="console-field">
              <label class="console-field__label">Scope · 范围</label>
              <select name="scope" class="console-select">
                <option value="city">city</option>
                <option value="province">province</option>
              </select>
            </div>
            <div class="console-field">
              <label class="console-field__label">Name</label>
              <input name="name" class="console-input" list="city-list" required>
              <datalist id="city-list"></datalist>
            </div>
            <div class="console-field">
              <label class="console-field__label">Indicator</label>
              <select name="indicator" class="console-select" id="indicator"></select>
            </div>
          </div>
          <button type="submit" class="console-button" id="run-btn">Run · 诊断</button>
        </form>
      </div>

      <div id="result-error"></div>

      <div id="result-section" class="console-hidden">
        <div class="console-card">
          <div class="console-card__header">
            <h3>5 项测试</h3>
            <span id="verdict-badge"></span>
          </div>
          <div id="diag-chart" class="console-chart"></div>
        </div>

        <div class="console-card">
          <h3>详细结果</h3>
          <table class="console-table" id="tests-table">
            <thead><tr><th>测试</th><th>p-value</th><th>statistic</th><th>passed</th></tr></thead>
            <tbody></tbody>
          </table>
          <p id="verdict-reason" class="console-text-muted console-text-small" style="margin-top: 12px;"></p>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/form-helpers.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/chart.js"></script>
  <script>
  (async function () {
    await RCA.form.populateCityDatalist("city-list");
    await RCA.form.populateIndicatorSelect("indicator");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      RCA.form.clearError("result-error");
      const params = RCA.form.formToDict(e.target);
      const r = await RCA.api.runTool("get_diagnostics", params);
      if (!r.ok) { RCA.form.showError("result-error", r.error); return; }
      const data = r.data.data;
      document.getElementById("result-section").classList.remove("console-hidden");
      const verdict = data.verdict || "—";
      const reason = data.verdict_reason ? " — " + data.verdict_reason : "";
      const badge = document.getElementById("verdict-badge");
      badge.className = "console-badge console-badge--" + RCA.form.verdictClass(verdict);
      badge.textContent = verdict;
      RCA.chart.renderDiagnosticsChart("diag-chart", data);
      const tests = RCA.chart.testsAsArray(data);
      const tbody = document.querySelector("#tests-table tbody");
      tbody.innerHTML = "";
      tests.forEach((t) => {
        const tr = document.createElement("tr");
        const passBadge = t.error
          ? '<span class="console-badge console-badge--err">ERR</span>'
          : (t.passed
            ? '<span class="console-badge console-badge--ok">PASS</span>'
            : '<span class="console-badge console-badge--err">FAIL</span>');
        tr.innerHTML = "<td>" + RCA.form.escapeHtml(t.name) + "</td>" +
          "<td class='console-text-mono'>" + (t.pvalue != null ? t.pvalue.toFixed(4) : "—") + "</td>" +
          "<td class='console-text-mono'>" + (t.statistic != null ? t.statistic.toFixed(4) : "—") + "</td>" +
          "<td>" + passBadge + "</td>";
        tbody.appendChild(tr);
      });
      // verdict reason 写在表下
      const summary = document.getElementById("verdict-reason");
      if (summary) summary.textContent = verdict + reason;
    };
  })();
  </script>
</body>
</html>
