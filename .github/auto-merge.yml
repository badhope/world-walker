# Dependabot auto-merge configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-auto-merge

---
# Enable auto-merge for patch and minor version updates
# when CI passes, except for major version bumps.
- match:
    dependency_type: production
    update_type: "semver:minor"
  enabled: true
  automerge: true
  commands:
    - type: "chore"

- match:
    dependency_type: production
    update_type: "semver:patch"
  enabled: true
  automerge: true

- match:
    dependency_type: development
    update_type: "semver:patch"
  enabled: true
  automerge: true

# Never auto-merge major version bumps
- match:
    update_type: "semver:major"
  automerge: false
