name: CI

# Gitee Go 流水线（与 .github/workflows/ci.yml 等价）
# Gitee 不执行 GitHub Actions 语法，这里用 Gitee Go 的 stage/step 声明同一套检查。
# 三个平台跑同一批测试，任一平台红即视为交付失败。

trigger:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

stages:
  - name: core
    displayName: 零依赖核心
    steps:
      - step: setup
        name: setup-python
        displayName: 准备 Python
        script: |
          python --version
      - step: deps-check
        name: assert-no-third-party
        displayName: 确认零第三方依赖
        script: |
          python -c "import numpy" 2>/dev/null && { echo "numpy 存在，零依赖宣称不成立"; exit 1; } || echo "OK: no numpy"
          python -c "import mcp" 2>/dev/null && { echo "mcp 应为可选依赖"; exit 1; } || echo "OK: no mcp"
      - step: compile
        name: compileall
        displayName: 编译全部 Python 源
        script: |
          python scripts/compile_all.py
      - step: audit
        name: verify-tests
        displayName: 断言审计
        script: |
          python scripts/verify_tests.py
      - step: cli
        name: verify-cli
        displayName: CLI 通道自检
        script: |
          python scripts/verify_cli.py
      - step: panel
        name: verify-panel
        displayName: 面板契约自检
        script: |
          python scripts/verify_panel.py
      - step: neardeath
        name: verify-near-death
        displayName: 濒死保护自检
        script: |
          python scripts/verify_near_death.py
      - step: formulas
        name: verify-formulas
        displayName: 规则内核公式对拍
        script: |
          python scripts/verify_formulas.py
      - step: branches
        name: verify-branches
        displayName: 模块分支补测
        script: |
          python scripts/verify_branches.py
      - step: memory
        name: verify-memory
        displayName: 长局内存稳定性
        script: |
          python -m pip install --quiet psutil
          python scripts/verify_memory.py 300
      - step: settings
        name: verify-settings
        displayName: 多世界观设定包
        script: |
          python scripts/verify_settings.py
      - step: docs
        name: verify-docs
        displayName: 文档一致性
        script: |
          python scripts/verify_docs.py
      - step: smoke
        name: engine-smoke
        displayName: 引擎烟测
        script: |
          python engine.py --help > /dev/null
          python init_game.py "$PWD/smoke.json"
          python engine.py world_state --state "$PWD/smoke.json" > /dev/null
          python engine.py combat --state "$PWD/smoke.json" --attacker player --defender goblin > /dev/null
          echo "CLI OK"

  - name: mcp
    displayName: MCP 端到端
    steps:
      - step: install
        name: install-mcp
        displayName: 安装 MCP 依赖
        script: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"
      - step: e2e
        name: verify-mcp
        displayName: MCP 端到端自检
        script: |
          python scripts/verify_mcp_stdio.py
      - step: injection
        name: verify-injection
        displayName: 提示词注入防护
        script: |
          python scripts/verify_injection.py
      - step: mutation
        name: verify-mutation
        displayName: 变异测试
        script: |
          python scripts/verify_mutation.py
      - step: playtest
        name: user-playtest
        displayName: 玩家视角试玩
        script: |
          python scripts/user_playtest.py
      - step: stress
        name: stress
        displayName: 长局压力测试
        script: |
          python scripts/stress_freeplay.py 500

  - name: showcase
    displayName: 展示素材
    steps:
      - step: assets
        name: verify-assets
        displayName: 截图/演示存档/展示站齐全
        script: |
          python - <<'PY'
          import os, sys, json
          need = ["docs/index.html", "docs/BENCHMARK.md",
                  "docs/screenshots/stage-xuanshu.png",
                  "docs/screenshots/stage-ink.png",
                  "docs/screenshots/stage-neon.png",
                  "docs/screenshots/stage-neutral.png",
                  "docs/screenshots/walkthrough.mp4",
                  "docs/demo/玄枢界.save.json"]
          missing = [p for p in need if not os.path.exists(p) or os.path.getsize(p) == 0]
          print("missing:", missing)
          if missing:
              sys.exit(1)
          for w in ("玄枢界", "折剑行", "霓虹深渊", "雾港"):
              d = json.load(open("docs/demo/%s.save.json" % w, encoding="utf-8"))
              assert d["tick"] > 0 and d["entities"]["player"]
          print("showcase assets ok")
          PY

  - name: package
    displayName: 打包完整性
    steps:
      - step: build
        name: build-dist
        displayName: 构建 sdist + wheel
        script: |
          python -m pip install --upgrade pip build
          python -m build
      - step: verify-wheel
        name: verify-wheel
        displayName: 校验 wheel 资源
        script: |
          python scripts/check_wheel.py dist

