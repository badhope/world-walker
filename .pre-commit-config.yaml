# Pre-commit hooks configuration
# See: https://pre-commit.com
# Install: pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files

repos:
  # ============================================
  # General hygiene
  # ============================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(data/|docs/.*\.md$|.*\.lock$|.*\.csv$)
      - id: end-of-file-fixer
        exclude: ^(data/.*\.(csv|db|sqlite|parquet|json))$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^\.github/repository-metadata\.json$
      - id: check-json
        exclude: ^(package-lock\.json|.*\.lock)$
      - id: check-toml
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch=main, --branch=master]

  # ============================================
  # Python: Black (formatter)
  # ============================================
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=120, --target-version=py311]
        exclude: ^(data/|docs/.*\.md$|\.venv/|build/|dist/)

  # ============================================
  # Python: isort (import sorter)
  # ============================================
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120, --known-third-party=fastapi,pydantic,uvicorn]
        exclude: ^(data/|docs/.*\.md$|\.venv/|build/|dist/)

  # ============================================
  # Python: Ruff (lint + format)
  # ============================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --line-length=120]
        exclude: ^(data/|docs/.*\.md$|\.venv/|build/|dist/)
      - id: ruff-format
        args: [--line-length=120]
        exclude: ^(data/|docs/.*\.md$|\.venv/|build/|dist/)

  # ============================================
  # Python: mypy (type checking, optional)
  # ============================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        language_version: python3.11
        files: ^backend/
        additional_dependencies: [pydantic, pydantic-settings, types-requests]
        args: [--ignore-missing-imports, --no-strict-optional, --check-untyped-defs]
        # Disabled by default; enable per-repo as type coverage grows
        # stages: [manual]

  # ============================================
  # Python: bandit (security linter)
  # ============================================
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        language_version: python3.11
        args: [-lll, --skip=B101]
        exclude: ^tests/

  # ============================================
  # Markdown: lint + format
  # ============================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable=MD013, --disable=MD033, --disable=MD041]
        exclude: ^(CHANGELOG\.md|docs/REPOSITORY_METADATA\.md)$

  # ============================================
  # Shell: shellcheck
  # ============================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  # ============================================
  # YAML: prettier
  # ============================================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.3.2
    hooks:
      - id: prettier
        types_or: [yaml, markdown, json]
        args: [--print-width=120, --prose-wrap=preserve]
        exclude: ^(package-lock\.json|.*\.lock|CITATION\.cff)$

  # ============================================
  # Conventional Commits
  # ============================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
