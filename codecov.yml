# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: yes
  notify:
    after_n_builds: 3        # python (pytest), fuzz, frontend
    wait_for_ci: yes

coverage:
  precision: 1
  round: down
  range: "70...90"
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 70%

# Ignore generated / vendored / large files
ignore:
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/node_modules/**"
  - "**/*.pkl"
  - "**/*.joblib"
  - "scripts/legacy/**"
  - "docs/archive/**"
  - "tests/fuzz/**"
  - "tests/**"               # tests are not production code

# Per-flag coverage
flag_management:
  default_rules:
    carryforward: yes
    statuses:
      - type: project
        target: 80%
      - type: patch
        target: 70%
  individual_flags:
    - name: backend
      paths:
        - backend/
    - name: api
      paths:
        - backend/api/
    - name: analysis
      paths:
        - backend/analysis/
