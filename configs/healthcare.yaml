data: {}
industry:
  data_requirements:
  - population
  - elderly_ratio
  - disease_prevalence
  - insurance_coverage
  - hospital_density
  - bed_utilization
  - specialist_availability
  - wait_time
  - medical_staff_ratio
  - equipment_level
  - cost_efficiency
  - revenue_per_patient
  description: 医疗机构选址与服务能力评估模板
  dimensions:
  - description: 评估医疗需求市场规模
    display_name: 需求维度
    higher_is_better:
      disease_prevalence: true
      elderly_ratio: true
      insurance_coverage: true
      population: true
    metric_weights:
      disease_prevalence: 0.2
      elderly_ratio: 0.3
      insurance_coverage: 0.15
      population: 0.35
    metrics:
    - population
    - elderly_ratio
    - disease_prevalence
    - insurance_coverage
    name: demand
    weight: 0.4
  - description: 评估市场竞争态势
    display_name: 竞争维度
    higher_is_better:
      bed_utilization: true
      hospital_density: false
      specialist_availability: true
      wait_time: false
    metric_weights:
      bed_utilization: 0.25
      hospital_density: 0.3
      specialist_availability: 0.25
      wait_time: 0.2
    metrics:
    - hospital_density
    - bed_utilization
    - specialist_availability
    - wait_time
    name: competition
    weight: 0.3
  - description: 评估医疗资源配置
    display_name: 资源维度
    higher_is_better:
      cost_efficiency: true
      equipment_level: true
      medical_staff_ratio: true
      revenue_per_patient: true
    metric_weights:
      cost_efficiency: 0.25
      equipment_level: 0.25
      medical_staff_ratio: 0.3
      revenue_per_patient: 0.2
    metrics:
    - medical_staff_ratio
    - equipment_level
    - cost_efficiency
    - revenue_per_patient
    name: resource
    weight: 0.3
  industry_id: healthcare
  industry_name: 医疗健康行业
  industry_type: healthcare
  metrics:
    bed_utilization:
      benchmark_method: percentile
      data_source: 医院数据
      description: 病床实际使用率
      display_name: 床位使用率
      name: bed_utilization
      unit: '%'
    cost_efficiency:
      benchmark_method: percentile
      data_source: 医院数据
      description: 医疗成本控制率
      display_name: 成本效率
      name: cost_efficiency
      unit: '%'
    disease_prevalence:
      benchmark_method: percentile
      data_source: 卫健委
      description: 慢性病发病率
      display_name: 疾病发病率
      name: disease_prevalence
      unit: '%'
    elderly_ratio:
      benchmark_method: percentile
      data_source: 统计局
      description: 65岁以上人口占比
      display_name: 老龄化比例
      name: elderly_ratio
      unit: '%'
    equipment_level:
      benchmark_method: percentile
      data_source: 综合评估
      description: 医疗设备配置评分
      display_name: 设备水平
      name: equipment_level
      unit: 分
    hospital_density:
      benchmark_method: percentile
      data_source: 卫健委
      description: 每10万人拥有医院数量
      display_name: 医院密度
      name: hospital_density
      unit: 家/10万人
    insurance_coverage:
      benchmark_method: percentile
      data_source: 医保局
      description: 基本医保参保率
      display_name: 医保覆盖率
      name: insurance_coverage
      unit: '%'
    medical_staff_ratio:
      benchmark_method: percentile
      data_source: 医院数据
      description: 执业医师/护士比例
      display_name: 医护比
      name: medical_staff_ratio
      unit: '%'
    population:
      benchmark_method: percentile
      data_source: 统计局
      description: 服务半径内常住人口
      display_name: 服务人口
      name: population
      unit: 万人
    revenue_per_patient:
      benchmark_method: percentile
      data_source: 医院数据
      description: 每患者平均收入
      display_name: 人均收入
      name: revenue_per_patient
      unit: 元/人次
    specialist_availability:
      benchmark_method: percentile
      data_source: 卫健委
      description: 每万人拥有的专科医生数
      display_name: 专科医生可及性
      name: specialist_availability
      unit: 人/万人
    wait_time:
      benchmark_method: percentile
      data_source: 医院数据
      description: 门诊平均等待时间
      display_name: 平均等待时间
      name: wait_time
      unit: 分钟
  success_metrics:
  - population
  - bed_utilization
  - revenue_per_patient
ml:
  cross_validation_folds: 5
  feature_columns:
  - population
  - elderly_ratio
  - disease_prevalence
  - insurance_coverage
  - hospital_density
  - specialist_availability
  - medical_staff_ratio
  - equipment_level
  - cost_efficiency
  hyperparameter_tuning: true
  id_column: hospital_id
  models:
  - xgboost
  - random_forest
  - gbdt
  - prophet
  - linear_regression
  target_metric: revenue_per_patient
  time_column: year
  train_size: 0.8
  validation_size: 0.2
project_name: healthcare_facility_analysis
regions:
- Shanghai
- Beijing
- Guangzhou
- Shenzhen
- Chengdu
