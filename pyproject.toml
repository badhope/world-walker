[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "world-walker"
version = "1.16.2"
description = "World Walker — 单人长局、对话优先的 AI 跑团游戏（OpenAI-compatible 模型，即插即玩）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "badhope" }]
keywords = ["interactive-fiction", "mcp", "ai-agent", "text-game", "emergent-narrative", "rule-engine"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# 锁定版本见 requirements-mcp.lock.txt（经 OSV 扫描无已知漏洞）
mcp = ["mcp>=2.3,<3"]

[project.scripts]
wg = "game_engine.cli:main"
world-walker = "game_engine.engine:main"
world-walker-mcp = "game_engine.mcp_server:main"

[tool.setuptools]
# 仓库根即 game_engine 包（引擎内部统一 `import game_engine.*`）
package-dir = { "game_engine" = "." }
packages = ["game_engine", "game_engine.rules"]

# 运行时按路径读取的非 .py 资源必须进包，否则 pip 安装后 open_panel / load_setting 会找不到文件
[tool.setuptools.package-data]
game_engine = [
  "panel.html",
  "panel.css",
  "panel.js",
  "cli.py",
  "mcp_primitives.py",
  "action_log.py",
  "settings/*.json",
  "settings/*.md",
  "README.md",
  "README.zh-CN.md",
  "BRAND.md",
  "ARCHITECTURE.md",
  "CHANGELOG.md",
  "ROADMAP.md",
  "CONTRIBUTING.md",
  "CODE_OF_CONDUCT.md",
  "SECURITY.md",
  "docs/*.md",
  "docs/metrics.json",
  "docs/screenshots/*.png",
  "docs/screenshots/*.md",
  "docs/screenshots/*.mp4",
  "docs/demo/*.json",
  "docs/demo/*.jsonl",
  "docs/demo/*.md",
]
