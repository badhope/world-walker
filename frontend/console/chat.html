<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat · RCA Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/console.css">
</head>
<body>
  <div class="console-layout">
    <aside class="console-sidebar" id="sidebar"></aside>
    <main class="console-main">
      <header class="console-page-header">
        <h1>Chat <span class="console-card--tool__zh">智能体对话</span></h1>
        <p class="console-page-header__desc">
          LLM Agent 流式对话(SSE) — 自然语言触发 9 项 tool,自动 multi-round。
          session 状态后端保存(默认 session_id="console")。
        </p>
      </header>

      <div class="console-card">
        <div class="console-flex console-flex--between">
          <h3 class="console-card__title">Session · <span id="session-id" class="console-text-mono">console</span></h3>
          <button class="console-button console-button--ghost" id="clear-btn">Clear · 清屏</button>
        </div>
      </div>

      <div id="result-error"></div>

      <div id="messages" class="console-chat"></div>

      <form id="form" class="console-card console-form">
        <textarea name="message" id="msg-input" class="console-input console-textarea" rows="3"
          placeholder="问我:深圳 GDP 5 年预测 / 给我看下深圳风险指标 / 解释一下 diagnostics..." required></textarea>
        <div class="console-flex console-flex--between" style="margin-top:12px">
          <span id="status" class="console-text-muted console-text-small">就绪</span>
          <div>
            <button type="button" class="console-button console-button--ghost" id="sync-btn">Sync · 同步</button>
            <button type="submit" class="console-button" id="send-btn">Send · 发送</button>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/form-helpers.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  const SESSION_ID = "console-" + Math.random().toString(36).slice(2, 8);
  document.getElementById("session-id").textContent = SESSION_ID;

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "console-msg console-msg--" + role;
    div.innerHTML = '<div class="console-msg__role">' + role + "</div>" +
      '<div class="console-msg__content">' + escapeHtml(text) + "</div>";
    document.getElementById("messages").appendChild(div);
    div.scrollIntoView({ behavior: "smooth" });
    return div;
  }

  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }

  document.getElementById("clear-btn").onclick = () => {
    document.getElementById("messages").innerHTML = "";
  };

  // 同步 (non-stream) - 给不用流式也行的快捷方式
  document.getElementById("sync-btn").onclick = async () => {
    const msg = document.getElementById("msg-input").value.trim();
    if (!msg) return;
    setStatus("同步调中…");
    addMessage("user", msg);
    document.getElementById("msg-input").value = "";
    const r = await RCA.api.chat(SESSION_ID, msg);
    if (!r.ok) {
      addMessage("error", r.error);
      setStatus("出错");
      return;
    }
    addMessage("assistant", r.data.content || "(空响应)");
    setStatus("就绪");
  };

  // 流式
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg-input").value.trim();
    if (!msg) return;
    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="console-spinner"></span> 思考中…';
    setStatus("调用 LLM…");
    addMessage("user", msg);
    document.getElementById("msg-input").value = "";
    const assistantDiv = addMessage("assistant", "");
    const contentEl = assistantDiv.querySelector(".console-msg__content");
    let buf = "";
    let lastEvType = null;

    await RCA.api.streamChat(SESSION_ID, msg, (ev) => {
      if (ev.type === "token" || ev.type === "delta" || ev.type === "content") {
        buf += ev.content || ev.delta || ev.text || "";
        contentEl.textContent = buf;
        setStatus("流式中…(" + buf.length + " 字)");
        lastEvType = "stream";
      } else if (ev.type === "thinking") {
        // LLM 思考中 — 状态栏显示,不渲染内容
        setStatus("思考中…");
        lastEvType = "thinking";
      } else if (ev.type === "tool_call" || ev.type === "tool") {
        const call = ev.name || ev.tool || "tool";
        setStatus("调 tool: " + call);
      } else if (ev.type === "tool_result") {
        setStatus("tool 返回");
      } else if (ev.type === "final" || ev.type === "done") {
        setStatus("就绪");
      } else if (ev.type === "error") {
        if (buf) buf += "\n\n";
        buf += "[error] " + (ev.message || JSON.stringify(ev));
        contentEl.textContent = buf;
        setStatus("出错");
      } else if (ev.content) {
        buf += ev.content;
        contentEl.textContent = buf;
        lastEvType = "stream";
      }
    });

    if (!buf) {
      contentEl.textContent = "(无内容返回 — 后端 chat 可能不在跑)";
    }
    setStatus("就绪");
    btn.disabled = false;
    btn.textContent = "Send · 发送";
  };
  </script>
</body>
</html>
