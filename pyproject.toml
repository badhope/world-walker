[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regional-economic-analysis"
version = "4.0.0"
description = "Regional Industrial Economic Analysis Platform: a production-grade multi-scenario analytics system for city comparison, retail site selection, sales forecasting and government industry policy evaluation."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    {name = "Regional Economic Analysis Team"}
]
keywords = [
    "regional-economy",
    "economic-analysis",
    "city-comparison",
    "industry-analysis",
    "retail-location",
    "sales-forecast",
    "site-selection",
    "policy-evaluation",
    "time-series-forecasting",
    "data-visualization",
    "fastapi",
    "echarts",
    "data-science",
    "machine-learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Government",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Sociology",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
]

[project.urls]
Homepage = "https://github.com/your-org/regional-economic-analysis"
Repository = "https://github.com/your-org/regional-economic-analysis"
Issues = "https://github.com/your-org/regional-economic-analysis/issues"
Documentation = "https://github.com/your-org/regional-economic-analysis/blob/main/README.md"
Changelog = "https://github.com/your-org/regional-economic-analysis/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py311"]
