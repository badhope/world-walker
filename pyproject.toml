[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "national-stats-analyzer"
version = "4.0.0"
description = "区域产业经济分析平台 - 面向求职的可复用分析工具"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "区域产业经济分析团队", email = "contact@example.com"}
]
keywords = [
    "economic-analysis",
    "regional-industry",
    "semiconductor",
    "data-analysis",
    "visualization",
    "fastapi",
    "plotly",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "akshare>=1.12.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.0",
    "weasyprint>=60.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/badhope/national_stats"
Documentation = "https://github.com/badhope/national_stats/docs"
Repository = "https://github.com/badhope/national_stats"
Issues = "https://github.com/badhope/national_stats/issues"

[project.scripts]
national-stats = "main:main"
national-stats-api = "main:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
  | frontend
)/
'''

[tool.isort]
profile = "black"
line-length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
extend_skip_glob = ["frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short --strict-markers --strict-config"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "slow: Slow running tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["backend", "config"]
parallel = true
omit = [
    "*/__init__.py",
    "*/tests/*",
    "*/examples/*",
    "*/test_*.py",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "if TYPE_CHECKING:",
    "def __str__",
    "def __eq__",
    "def __hash__",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
exclude = [
    '^/venv/',
    '^/build/',
    '^/dist/',
    '^/frontend/',
    '^/node_modules/',
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "frontend",
    "node_modules",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (conflict with black)
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "config"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"test_*.py" = ["F401", "F403"]
