services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:8001"]
      - MODEL_SIGNING_KEY=${MODEL_SIGNING_KEY:-change-me-in-production}
    volumes:
      - ./data:/workspace/data
    restart: unless-stopped