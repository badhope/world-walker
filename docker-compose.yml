services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: regional-economic-analysis-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=False
      - CORS_ORIGINS=["http://localhost:8000","http://localhost:8080","http://127.0.0.1:8000","http://127.0.0.1:8080","http://0.0.0.0:8000"]
      - LOG_LEVEL=INFO
      # LLM chat assistant (v7.0) - 配置一个即可
      - LLM_DEFAULT_BACKEND=${LLM_DEFAULT_BACKEND:-openai}
      - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY:-}
      - LLM_OPENAI_MODEL=${LLM_OPENAI_MODEL:-gpt-4o-mini}
      - LLM_ANTHROPIC_API_KEY=${LLM_ANTHROPIC_API_KEY:-}
      - LLM_ANTHROPIC_MODEL=${LLM_ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - LLM_OLLAMA_BASE_URL=${LLM_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LLM_OLLAMA_MODEL=${LLM_OLLAMA_MODEL:-qwen2.5:7b}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:alpine
    container_name: regional-economic-analysis-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api