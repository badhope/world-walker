# Dependabot configuration — extended with auto-merge, security updates,
# grouped version bumps and GitHub Actions SHA pinning.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
enable-beta-ecosystems: true

# ============================================
# Python: pip
# ============================================
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "auto-merge"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "starlette"
          - "pydantic"
          - "pydantic-settings"
      data-science:
        patterns:
          - "pandas"
          - "numpy"
          - "scipy"
          - "scikit-learn"
          - "statsmodels"
          - "joblib"
      dev-tools:
        patterns:
          - "pytest"
          - "black"
          - "ruff"
          - "isort"
          - "mypy"
          - "coverage"
          - "hypothesis"
      security:
        patterns:
          - "cryptography"
          - "pyjwt"
          - "jinja2"
        applies-to: version-updates
    # Skip major version bumps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Reviewer assignment
    reviewers:
      - "your-org/maintainers"
    assignees:
      - "your-org/maintainers"

# ============================================
# GitHub Actions
# ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    reviewers:
      - "your-org/maintainers"

# ============================================
# Docker
# ============================================
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "docker"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

# ============================================
# Pre-commit (git-hooks ecosystem)
# ============================================
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "submodules"
    commit-message:
      prefix: "submodules"
