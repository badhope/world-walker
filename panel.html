<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="World Walker · 一个世界，一句话，剩下的交给它。" />
<meta name="theme-color" content="#f3eee2" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23241f18'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23e5c07b' font-family='serif'%3E%E8%A1%8C%3C/text%3E%3C/svg%3E" />
<title>World Walker · 世界行者</title>
<link rel="stylesheet" href="/panel.css" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- Lobby -->
<section class="screen lobby" id="lobby" aria-label="大厅">
  <header class="lobby-head">
    <div class="brand-row">
      <span class="seal" aria-hidden="true">行</span>
      <div>
        <h1 class="wordmark">World Walker</h1>
        <p class="tagline">一个世界，一句话，剩下的交给它。</p>
      </div>
    </div>
    <button class="ghost-btn" id="lobby-model-btn" type="button">模型连接</button>
  </header>

  <div class="lobby-grid">
    <section class="continue-card" id="continue-card" aria-live="polite">
      <p class="eyebrow">继续上次</p>
      <div id="continue-body" class="continue-body">
        <p class="muted">还没有正在进行的局。</p>
      </div>
    </section>

    <section class="new-card">
      <div class="section-head">
        <h2>开一个新世界</h2>
        <span class="hint">先说你想玩什么</span>
      </div>
      <p class="session-teaser">不用先选模板。告诉我类型、玩法和你想要的角色，我配一局给你。</p>
      <button class="primary-btn wide" id="new-btn" type="button">开始配置</button>
    </section>

    <section class="saves-card">
      <div class="section-head">
        <h2>存档</h2>
        <span class="hint" id="saves-count"></span>
      </div>
      <div class="saves-list" id="saves-list"></div>
    </section>
  </div>

  <footer class="lobby-foot">
    <span>World Walker · 对话游戏引擎</span>
    <span id="version-line">规则为证</span>
  </footer>
</section>

<!-- Play -->
<section class="screen play" id="play" hidden aria-label="对局">
  <header class="play-head">
    <button class="icon-btn" id="back-btn" type="button" aria-label="返回大厅">←</button>
    <div class="play-title">
      <h2 id="world-name">—</h2>
      <span id="world-meta" class="muted"></span>
    </div>
    <div class="play-actions">
      <button class="model-badge" id="model-badge" type="button" title="模型连接">模型</button>
      <button class="ghost-btn" id="menu-btn" type="button">菜单</button>
    </div>
  </header>

  <main class="play-main">
    <section class="story-column" aria-label="叙事">
      <div class="feed" id="feed" aria-live="polite"></div>
      <div class="composer" id="composer">
        <div class="composer-inner">
          <textarea id="action-text" rows="1" maxlength="2000"
                    placeholder="你要做什么？说一句话就好…" aria-label="你的行动"></textarea>
          <button class="send-btn" id="send-btn" type="button" title="发送（Enter）">发送</button>
        </div>
        <div class="composer-foot">
          <span id="composer-hint">Enter 发送 · Shift+Enter 换行</span>
          <span id="typing" class="typing" hidden>世界正在回应…</span>
        </div>
      </div>
    </section>

    <aside class="rail" aria-label="角色与世界">
      <nav class="rail-tabs" id="rail-tabs">
        <button type="button" data-rail="character" class="active">角色</button>
        <button type="button" data-rail="quests">任务</button>
        <button type="button" data-rail="relations">人情</button>
        <button type="button" data-rail="world">世界</button>
      </nav>
      <div class="rail-body" id="rail-body"></div>
    </aside>
  </main>
</section>

<!-- Session Zero -->
<div class="overlay" id="session-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="session-title">
  <div class="overlay-panel session-panel">
    <header class="overlay-head">
      <h2 id="session-title">开局：先说你想要什么</h2>
      <button class="icon-btn" data-close="session-overlay" type="button" aria-label="关闭">×</button>
    </header>
    <div class="session-steps" id="session-steps"></div>
    <div class="session-body" id="session-body"></div>
    <footer class="session-foot">
      <button class="ghost-btn" id="session-back" type="button">上一步</button>
      <span class="muted" id="session-step-label"></span>
      <button class="primary-btn" id="session-next" type="button">下一步</button>
    </footer>
  </div>
</div>

<!-- World overlay -->
<div class="overlay" id="world-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="world-overlay-title">
  <div class="overlay-panel world-panel">
    <header class="overlay-head">
      <h2 id="world-overlay-title">世界</h2>
      <button class="icon-btn" data-close="world-overlay" type="button" aria-label="关闭">×</button>
    </header>
    <nav class="overlay-tabs" id="world-tabs">
      <button type="button" data-world="codex" class="active">图鉴</button>
      <button type="button" data-world="log">日志</button>
      <button type="button" data-world="map">地图</button>
      <button type="button" data-world="market">市场</button>
      <button type="button" data-world="archive">档案</button>
    </nav>
    <div class="overlay-body" id="world-body"></div>
  </div>
</div>

<!-- Menu overlay -->
<div class="overlay" id="menu-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="overlay-panel menu-panel">
    <header class="overlay-head">
      <h2 id="menu-title">菜单</h2>
      <button class="icon-btn" data-close="menu-overlay" type="button" aria-label="关闭">×</button>
    </header>
    <div class="overlay-body menu-body">
      <button class="menu-row" id="menu-saves" type="button">存档与继续 <span>→</span></button>
      <button class="menu-row" id="menu-model" type="button">模型连接 <span>→</span></button>
      <button class="menu-row" id="menu-export" type="button">导出这一局 <span>↓</span></button>
      <button class="menu-row" id="menu-world" type="button">打开世界 <span>→</span></button>
      <button class="menu-row" id="menu-about" type="button">关于 World Walker <span>?</span></button>
      <button class="menu-row danger" id="menu-back" type="button">回到大厅 <span>←</span></button>
    </div>
  </div>
</div>

<!-- Model dialog -->
<div class="overlay" id="model-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="model-title">
  <div class="overlay-panel model-panel">
    <header class="overlay-head">
      <h2 id="model-title">模型连接</h2>
      <button class="icon-btn" data-close="model-overlay" type="button" aria-label="关闭">×</button>
    </header>
    <div class="overlay-body">
      <p class="muted model-note">只认 OpenAI-compatible 协议：填网关地址、模型名和 Key 即可，不绑定任何厂商。</p>
      <label class="field"><span>接口地址 base_url</span>
        <input id="model-base" type="url" placeholder="https://你的网关/v1" autocomplete="off" spellcheck="false" /></label>
      <label class="field"><span>模型名 model</span>
        <input id="model-name" type="text" placeholder="任意模型名" autocomplete="off" spellcheck="false" /></label>
      <label class="field"><span>API Key</span>
        <input id="model-key" type="password" placeholder="sk-…（本地保存，0600）" autocomplete="off" /></label>
      <div class="model-status" id="model-status" aria-live="polite"></div>
      <div class="model-actions">
        <button class="ghost-btn" id="model-test" type="button">测试连接</button>
        <button class="primary-btn" id="model-save" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/panel.js"></script>
</body>
</html>
