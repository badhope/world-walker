<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backtest · RCA Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/console.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
  <div class="console-layout">
    <aside class="console-sidebar" id="sidebar"></aside>
    <main class="console-main">
      <header class="console-page-header">
        <h1>Backtest <span class="console-card--tool__zh">回测</span></h1>
        <p class="console-page-header__desc">
          Walk-forward 滚动交叉验证 5 指标(MAPE / RMSE / MASE / sMAPE / Coverage)
          — 衡量预测模型在新数据上的真实精度。
        </p>
      </header>

      <div class="console-card">
        <form id="form" class="console-form">
          <div class="console-form__row">
            <div class="console-field">
              <label class="console-field__label">Scope · 范围</label>
              <select name="scope" class="console-select">
                <option value="city">city</option>
                <option value="province">province</option>
              </select>
            </div>
            <div class="console-field">
              <label class="console-field__label">Name</label>
              <input name="name" class="console-input" list="city-list" required>
              <datalist id="city-list"></datalist>
            </div>
            <div class="console-field">
              <label class="console-field__label">Indicator</label>
              <select name="indicator" class="console-select" id="indicator"></select>
            </div>
          </div>
          <button type="submit" class="console-button" id="run-btn">Run · 回测</button>
        </form>
      </div>

      <div id="result-error"></div>

      <div id="result-section" class="console-hidden">
        <div class="console-card">
          <h3 class="console-card__title">实际 vs 预测</h3>
          <div id="backtest-chart" class="console-chart"></div>
        </div>

        <div class="console-card-grid" id="metrics-cards"></div>

        <div class="console-card">
          <h3 class="console-card__title">逐年明细</h3>
          <table class="console-table" id="detail-table">
            <thead><tr><th>步</th><th>实际</th><th>预测</th><th>误差</th><th>误差%</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/form-helpers.js"></script>
  <script src="../js/sidebar.js"></script>
  <script src="../js/chart.js"></script>
  <script>
  (async function () {
    await RCA.form.populateCityDatalist("city-list");
    await RCA.form.populateIndicatorSelect("indicator");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      RCA.form.clearError("result-error");
      const params = RCA.form.formToDict(e.target);
      const r = await RCA.api.runTool("get_backtest", params);
      if (!r.ok) { RCA.form.showError("result-error", r.error); return; }
      const data = r.data.data;
      document.getElementById("result-section").classList.remove("console-hidden");
      const m = data.metrics || {};
      const metrics = [
        { label: "MAPE", value: m.MAPE_pct != null ? m.MAPE_pct.toFixed(2) + "%" : "—", suffix: "越低越好" },
        { label: "RMSE", value: m.RMSE != null ? m.RMSE.toFixed(2) : "—" },
        { label: "MASE", value: m.MASE != null ? m.MASE.toFixed(2) : "—", suffix: "< 1 优于 naive" },
        { label: "sMAPE", value: m.sMAPE_pct != null ? m.sMAPE_pct.toFixed(2) + "%" : "—" },
        { label: "Coverage", value: m.Coverage_pct != null ? m.Coverage_pct.toFixed(1) + "%" : "—", suffix: "目标 ~95%" },
      ];
      const container = document.getElementById("metrics-cards");
      container.innerHTML = "";
      metrics.forEach((mm) => {
        const div = document.createElement("div");
        div.className = "console-card console-metric";
        div.innerHTML = '<div class="console-metric__label">' + RCA.form.escapeHtml(mm.label) +
          (mm.suffix ? '<span class="console-text-muted console-text-small"> · ' + RCA.form.escapeHtml(mm.suffix) + '</span>' : '') +
          '</div><div class="console-metric__value">' + RCA.form.escapeHtml(String(mm.value)) + "</div>";
        container.appendChild(div);
      });

      RCA.chart.renderBacktestChart("backtest-chart", data.actuals || [], data.forecasts || []);

      const tbody = document.querySelector("#detail-table tbody");
      tbody.innerHTML = "";
      const actuals = data.actuals || [];
      const forecasts = data.forecasts || [];
      actuals.forEach((a, i) => {
        const f = forecasts[i];
        const err = a - f;
        const errPct = a ? (err / a * 100) : 0;
        const tr = document.createElement("tr");
        tr.innerHTML = "<td>" + (i + 1) + "</td>" +
          "<td class='console-text-mono'>" + a.toFixed(2) + "</td>" +
          "<td class='console-text-mono'>" + f.toFixed(2) + "</td>" +
          "<td class='console-text-mono'>" + err.toFixed(2) + "</td>" +
          "<td class='console-text-mono'>" + errPct.toFixed(2) + "%</td>";
        tbody.appendChild(tr);
      });
    };
  })();
  </script>
</body>
</html>
