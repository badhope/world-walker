<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Provenance · RCA Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/console.css">
</head>
<body>
  <div class="console-layout">
    <aside class="console-sidebar" id="sidebar"></aside>
    <main class="console-main">
      <header class="console-page-header">
        <h1>Data Provenance <span class="console-card--tool__zh">数据血缘</span></h1>
        <p class="console-page-header__desc">
          城市/省份每个数据点的来源(URL/来源名/置信度/估算标记)。
          投资决策级必备 — 知道每个数从哪儿来、是否可靠。
        </p>
      </header>

      <div class="console-card">
        <form id="form" class="console-form">
          <div class="console-form__row">
            <div class="console-field">
              <label class="console-field__label">Name · 城市/省份</label>
              <input name="name" class="console-input" list="city-list" placeholder="shenzhen" required>
              <datalist id="city-list"></datalist>
            </div>
          </div>
          <button type="submit" class="console-button" id="run-btn">Run · 查血缘</button>
        </form>
      </div>

      <div id="result-error"></div>

      <div id="result-section" class="console-hidden">
        <div class="console-card">
          <h3 class="console-card__title">基本信息</h3>
          <table class="console-table" id="basic-table">
            <tbody></tbody>
          </table>
        </div>

        <div class="console-card">
          <h3 class="console-card__title">数据来源 URL</h3>
          <ul class="console-lineage-list" id="url-list"></ul>
        </div>

        <div class="console-card">
          <h3 class="console-card__title">样例数据点 · Provenance 元数据</h3>
          <table class="console-table" id="sample-table">
            <tbody></tbody>
          </table>
        </div>

        <div class="console-card">
          <h3 class="console-card__title">覆盖指标</h3>
          <div id="indicators-list" class="console-text-mono console-text-small"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/form-helpers.js"></script>
  <script src="../js/sidebar.js"></script>
  <script>
  (async function () {
    await RCA.form.populateCityDatalist("city-list");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      RCA.form.clearError("result-error");
      const params = RCA.form.formToDict(e.target);
      const r = await RCA.api.runTool("get_data_provenance", params);
      if (!r.ok) { RCA.form.showError("result-error", r.error); return; }
      const data = r.data.data;
      document.getElementById("result-section").classList.remove("console-hidden");

      // 基本信息
      const basic = [
        ["城市", data.city || "—"],
        ["英文名", data.name_en || params.name || "—"],
        ["数据年数", (data.n_years ?? "—") + " 年"],
        ["起止年份", (data.year_range || []).join(" ~ ") || "—"],
      ];
      const bt = document.querySelector("#basic-table tbody");
      bt.innerHTML = "";
      basic.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<th style='width:140px;text-align:left'>" + RCA.form.escapeHtml(row[0]) + "</th><td>" + RCA.form.escapeHtml(String(row[1])) + "</td>";
        bt.appendChild(tr);
      });

      // URL 列表
      const ul = document.getElementById("url-list");
      ul.innerHTML = "";
      [
        { label: "本地统计局 URL", url: data.url },
        { label: "国家统计局 NBSC", url: data.nbsc_url },
      ].forEach((u) => {
        if (!u.url) return;
        const li = document.createElement("li");
        li.className = "console-lineage-item";
        li.innerHTML = '<span class="console-lineage-item__label">' + RCA.form.escapeHtml(u.label) + '</span>' +
          '<a class="console-lineage-item__url" href="' + RCA.form.escapeHtml(u.url) + '" target="_blank" rel="noopener">' + RCA.form.escapeHtml(u.url) + '</a>';
        ul.appendChild(li);
      });

      // 样例数据点
      const sp = data.sample_provenance || {};
      const sample = [
        ["年份", sp.year ?? "—"],
        ["指标", sp.indicator ?? "—"],
        ["来源", sp.source ?? "—"],
        ["估算标记", sp.estimated ? "是 ⚠" : "否"],
        ["置信度", sp.confidence != null ? (sp.confidence * 100).toFixed(0) + "%" : "—"],
      ];
      const st = document.querySelector("#sample-table tbody");
      st.innerHTML = "";
      sample.forEach((row) => {
        const tr = document.createElement("tr");
        tr.innerHTML = "<th style='width:140px;text-align:left'>" + RCA.form.escapeHtml(row[0]) + "</th><td>" + RCA.form.escapeHtml(String(row[1])) + "</td>";
        st.appendChild(tr);
      });

      // 覆盖指标
      const cov = data.coverage || {};
      const years = cov.years || [];
      const inds = cov.indicators || [];
      const il = document.getElementById("indicators-list");
      il.innerHTML = "";
      const yrChip = document.createElement("span");
      yrChip.className = "console-badge console-badge--info";
      yrChip.style.marginRight = "12px";
      yrChip.textContent = years.length + " 年(" + (years[0] ?? "—") + " ~ " + (years[years.length - 1] ?? "—") + ")";
      il.appendChild(yrChip);
      inds.forEach((i) => {
        const chip = document.createElement("span");
        chip.className = "console-badge console-badge--info";
        chip.style.margin = "2px 4px 2px 0";
        chip.style.display = "inline-block";
        chip.textContent = i;
        il.appendChild(chip);
      });
    };
  })();
  </script>
</body>
</html>
