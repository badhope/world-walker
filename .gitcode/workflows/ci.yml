name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: checkout
      - name: Python version
        run: python3 --version
      - name: Compile and audit
        run: |
          PYTHON=python3 bash scripts/ci_core.sh

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: checkout
      - name: Install MCP SDK
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-mcp.lock.txt
          python3 -m pip install --no-deps -e ".[mcp]"
          python3 -m pip check
      - name: MCP and regressions
        env:
          WORLD_GAMES_STRICT: "1"
        run: |
          python3 scripts/verify_world.py
          python3 scripts/verify_generic.py
          python3 scripts/verify_systems.py
          python3 scripts/verify_audit_fix.py
          python3 scripts/verify_mcp_stdio.py
          python3 scripts/verify_mcp_mode.py
          python3 scripts/verify_injection.py
          python3 scripts/verify_mutation.py
          python3 scripts/user_playtest.py
          python3 scripts/stress_freeplay.py 500

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: checkout
      - name: Build and verify wheel
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
          python3 scripts/check_wheel.py dist
