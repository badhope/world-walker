name: Frontend Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
  pull_request:
    paths:
      - "frontend/**"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: HTML/CSS/JS sanity check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: List frontend files
        run: ls -la frontend/

      - name: HTML validation (basic balance check)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text(encoding="utf-8")
          opens = len(re.findall(r"<(?!!|/)\w", html))
          closes = len(re.findall(r"</\w+", html))
          print(f"<tag opens: {opens}, </tag closes: {closes}")
          if opens == 0 or closes == 0:
            raise SystemExit("Empty / broken HTML")
          PY

      - name: Inline JS syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.DOTALL)
          print(f"Inline <script> blocks: {len(blocks)}")
          if not blocks:
              raise SystemExit("No inline script blocks found")
          for i, b in enumerate(blocks):
              print(f"  block {i}: {len(b)} chars")
          PY

      - name: Sanity check (no obvious secrets)
        run: |
          if grep -rEn "ghp_[A-Za-z0-9]{30,}" frontend/ ; then
            echo "❌ GitHub token found in frontend!"; exit 1
          fi
          echo "✅ No obvious secrets"
